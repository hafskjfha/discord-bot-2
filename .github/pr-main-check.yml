name: "PR: Tests and Build"

on:
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: "Run build test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build