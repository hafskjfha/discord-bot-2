name: Deploy to Server

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: jtw7913/discord-bot2
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
  
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Get Public IP
        id: ip
        run: echo "ipv4=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT

      # AWS 자격 증명 설정
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # Lightsail 방화벽에 SSH(22번) 포트 한시적 허용
      - name: Open Lightsail Port 22
        run: |
          aws lightsail open-instance-public-ports \
            --instance-name "my_web_server" \
            --port-info fromPort=22,toPort=22,protocol=tcp,cidrs=${{ steps.ip.outputs.ipv4 }}/32

      # 서버에 SSH 접속 및 배포 실행
      - name: Trigger deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            echo "===== Deploying Discord Bot ====="

            cd /srv/discord-bot
            docker pull jtw7913/discord-bot2:latest

            docker compose up -d --force-recreate

            docker image prune -f

            echo "===== Deployment Completed ====="


      # 배포 완료 후 IP 제거 (실패해도 실행되도록 always() 사용)
      - name: Close Lightsail Port 22
        if: always()
        run: |
          aws lightsail close-instance-public-ports \
            --instance-name "my_web_server" \
            --port-info fromPort=22,toPort=22,protocol=tcp,cidrs=${{ steps.ip.outputs.ipv4 }}/32